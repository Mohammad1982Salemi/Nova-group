<!-- Samsung Internet (also used inside Telegram and WhatsApp) recolours pages in its dark mode; flag it early. -->
<script>if (/SamsungBrowser/i.test(navigator.userAgent)) document.documentElement.classList.add('sb');</script>

<!-- Runs before first paint. The reader's language is an earlier choice, a ?lang= in the address, or else
     Persian for a Persian browser or a clock set to Tehran and English for everyone else. -->
<script>
(function () {
  var d = document.documentElement, want = null, asked = /[?&]lang=(fa|en)\b/.exec(location.search), i;
  try { if (asked) localStorage.setItem('nova-lang', asked[1]); want = localStorage.getItem('nova-lang'); } catch (e) {}
  if (asked) want = asked[1];
  if (want !== 'fa' && want !== 'en') {
    var said = navigator.languages || [navigator.language || ''], fa = false;
    for (i = 0; i < said.length; i++) if (/^fa\b/i.test(said[i])) fa = true;
    try { if (Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Tehran') fa = true; } catch (e) {}
    want = fa ? 'fa' : 'en';
  }
  if (d.hasAttribute('data-both')) {
    // the one page that carries both languages: under /en/ it reads in English
    var l = location.pathname.indexOf('/en/') === 0 ? 'en' : want;
    d.setAttribute('data-lang', l); d.lang = l; d.dir = l === 'fa' ? 'rtl' : 'ltr';
  } else if (want === 'en' && d.getAttribute('data-alt') &&
      !/bot|crawl|spider|slurp|preview|google|bing|yandex|baidu|duckduck|facebook|whatsapp|telegram|lighthouse/i.test(navigator.userAgent)) {
    // a Persian address is the default one: a reader of English is sent on to the same page under /en/
    d.style.visibility = 'hidden';
    setTimeout(function () { d.style.visibility = ''; }, 2500);
    location.replace(d.getAttribute('data-alt') + location.hash);
    return;
  }
  d.className += ' js';
  // a short opening, once per visit and never for people who asked for less motion
  try {
    if (!sessionStorage.getItem('nova-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      sessionStorage.setItem('nova-seen', '1'); d.className += ' intro';
    }
  } catch (e) {}
})();
</script>
