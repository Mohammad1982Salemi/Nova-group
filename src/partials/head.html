<!-- Runs before first paint so the page never flashes in the wrong language or direction. -->
<script>
(function () {
  var d = document.documentElement, l = null;
  try { l = localStorage.getItem('nova-lang'); } catch (e) {}
  if (l !== 'fa' && l !== 'en') l = (navigator.language || '').toLowerCase().indexOf('fa') === 0 ? 'fa' : 'en';
  d.setAttribute('data-lang', l); d.lang = l; d.dir = l === 'fa' ? 'rtl' : 'ltr';
  d.className += ' js';
})();
</script>
