<!-- Samsung Internet (also used inside Telegram and WhatsApp) recolours pages in its dark mode; flag it early. -->
<script>if (/SamsungBrowser/i.test(navigator.userAgent)) document.documentElement.classList.add('sb');</script>

<!-- Runs before first paint so the page never flashes in the wrong language or direction. -->
<script>
(function () {
  var d = document.documentElement, l = null;
  try { l = localStorage.getItem('nova-lang'); } catch (e) {}
  if (l !== 'fa' && l !== 'en') l = (navigator.language || '').toLowerCase().indexOf('fa') === 0 ? 'fa' : 'en';
  d.setAttribute('data-lang', l); d.lang = l; d.dir = l === 'fa' ? 'rtl' : 'ltr';
  d.className += ' js';
  // a short opening, once per visit and never for people who asked for less motion
  try {
    if (!sessionStorage.getItem('nova-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      sessionStorage.setItem('nova-seen', '1'); d.className += ' intro';
    }
  } catch (e) {}
})();
</script>
