<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="stemL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fed"/><stop offset="1" stop-color="#15389a"/>
    </linearGradient>
    <linearGradient id="stemR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe0f7"/><stop offset="1" stop-color="#2f7df6"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d0ff"/><stop offset=".45" stop-color="#5594f8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#bfe9ff" stop-opacity=".75"/><stop offset="1" stop-color="#bfe9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- a folded ribbon: two stems, with the diagonal passing in front of both -->
  <path d="M6 56V12h13v44z" fill="url(#stemL)"/>
  <path d="M41 56V12h13v44z" fill="url(#stemR)"/>
  <path d="M6 12 19 28.34V36.34L6 20z" fill="#020617" opacity=".28"/>
  <path d="M41 39.66 54 56V48L41 31.66z" fill="#020617" opacity=".24"/>
  <path d="M6 12h13l35 44H41z" fill="url(#band)"/>

  <!-- the nova: a four-point spark on the upper corner -->
  <circle cx="54" cy="11" r="11" fill="url(#halo)"/>
  <path d="M24 2c1.7 12.2 9.8 20.3 22 22-12.2 1.7-20.3 9.8-22 22-1.7-12.2-9.8-20.3-22-22C14.2 22.3 22.3 14.2 24 2Z"
        transform="translate(43.9 .9) scale(.42)" fill="#fff"/>
</svg>
